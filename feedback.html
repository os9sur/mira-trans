    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","Noto Sans Arabic","Noto Sans Thai",sans-serif;
      background:#f8fafc;color:#1e293b}
    .box{max-width:560px;width:100%;margin:16px;padding:32px;background:#fff;border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,.08)}
    .logo{display:block;width:64px;height:64px;border-radius:14px;margin:0 auto 20px}
    h2{margin:0 0 20px;font-size:20px;line-height:1.6;font-weight:600}
    label{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:15px;line-height:1.6;cursor:pointer;color:#334155}
    label input{margin-top:5px;flex-shrink:0}
    .hint{margin:20px 0 8px;font-size:14px;line-height:1.7;color:#64748b}
    textarea{width:100%;box-sizing:border-box;height:100px;padding:10px;border:1px solid #cbd5e1;
      border-radius:8px;font:inherit;font-size:15px}
        button{display:block;margin:16px auto 0;padding:10px 28px;border:0;border-radius:8px;background:#2563eb;
      color:#fff;font-size:15px;cursor:pointer}
    button:disabled{opacity:.5;cursor:default}
    .hp{position:absolute;left:-9999px}

  <div class="hint" id="hint"></div>

  <input class="hp" id="website" tabindex="-1" autocomplete="off">

const RTL = ['ar', 'fa'];

function pickLang(raw) {
  const l = (raw || 'en').toLowerCase();
  if (I18N[l]) return l;
  if (l.startsWith('zh')) return 'zh-tw';   // 简体已在 uninstall.html 分流
  const p = l.split('-')[0];
  if (p === 'pt') return 'pt-br';
  return I18N[p] ? p : 'en';
}

const params = new URLSearchParams(location.search);
const langKey = pickLang(params.get('browser_lang') || params.get('lang'));
const t = I18N[langKey];

document.documentElement.lang = langKey;
document.documentElement.dir = RTL.includes(langKey) ? 'rtl' : 'ltr';
document.title = 'Mira Translator';

const REASONS = [
  ['site_broken', t.o1],
  ['want_free', t.o2],
  ['missing_feature', t.o3]
];

document.getElementById('title').textContent = t.title;
document.getElementById('hint').textContent = t.hint;
document.getElementById('submit').textContent = t.submit;

const reasonsEl = document.getElementById('reasons');
REASONS.forEach(([key, text], i) => {
  const label = document.createElement('label');
  const input = document.createElement('input');
  input.type = 'checkbox';
  input.name = 'reason';
  input.value = key;
  const span = document.createElement('span');
  span.textContent = `${i + 1}. ${text}`;
  label.append(input, span);
  reasonsEl.appendChild(label);
});

document.getElementById('submit').addEventListener('click', async (e) => {
  if (document.getElementById('website').value) return; // honeypot
  const reasons = [...document.querySelectorAll('input[name="reason"]:checked')].map(i => i.value);
  const comment = document.getElementById('comment').value.trim();
  if (!reasons.length && !comment) return;

  e.target.disabled = true;
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        reasons, comment,
        client_id: params.get('client_id'),
        version: params.get('version'),
        days_used: Number(params.get('days_used')) || 0,
        usage_count: Number(params.get('usage_count')) || 0,
        browser: params.get('browser'),
        os: params.get('os'),
        browser_lang: params.get('browser_lang')
      })
    });
    if (!res.ok) console.error('feedback failed:', res.status, await res.text());
  } catch (err) {
    console.error('feedback error:', err);
  }
  const box = document.getElementById('box');
  box.querySelectorAll(':scope > :not(.logo)').forEach(el => el.remove());
  const h = document.createElement('h2');
  h.textContent = t.thanks;
  box.appendChild(h);
});
