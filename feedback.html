<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="darkreader-lock">
  <meta name="color-scheme" content="light">
  <title>Mira Translator - Feedback</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Microsoft YaHei", "Noto Sans Arabic", "Noto Sans Thai", sans-serif;
      background:
        radial-gradient(circle at 15% 25%, #ff6b9d 0%, transparent 50%),
        radial-gradient(circle at 85% 20%, #ffa94d 0%, transparent 50%),
        radial-gradient(circle at 50% 85%, #845ef7 0%, transparent 55%),
        linear-gradient(160deg, #1a1a2e 0%, #16213e 100%);
      color: #1d1d1f;
      -webkit-font-smoothing: antialiased;
    }

    .box {
      max-width: 788px;
      width: 100%;
      margin: 16px;
      padding: 36px;
      position: relative;
      background: rgba(255, 255, 255, .83);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border: none;
      border-radius: 22px;
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, .6),
        inset 0 -1px 1px rgba(255, 255, 255, .1),
        0 25px 70px rgba(0, 0, 0, .45),
        0 12px 30px rgba(0, 0, 0, .3),
        0 4px 10px rgba(0, 0, 0, .2);
      overflow: visible;
    }

    .logo {
      display: block;
      width: 64px;
      height: 64px;
      border-radius: 14px;
      margin: 0 auto 20px;
    }

    h2 {
      margin: 0 0 20px;
      font-size: 20px;
      line-height: 1.6;
      font-weight: 600;
      text-align: center;
    }

    #reasons {
      width: 100%;
    }

    .reason-item {
      margin: 0;
    }

    label {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin: 10px 0;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 15px;
      line-height: 1.6;
      cursor: pointer;
      color: #334155;
      transition:
        background-color .15s,
        box-shadow .15s;
    }

    label:hover {
      background-color: #f1f5f9;
      box-shadow: 0 0 0 1px #e2e8f0 inset;
    }

    label input {
      appearance: none;
      -webkit-appearance: none;
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      margin-top: 2px;
      border: 2px solid #cbd5e1;
      border-radius: 7px;
      background: #fff;
      cursor: pointer;
      position: relative;
      transition:
        border-color .15s,
        background-color .15s,
        transform .1s;
    }

    label input:hover {
      border-color: #94a3b8;
    }

    label input:active {
      transform: scale(.92);
    }

    label input:checked {
      background: #16a34a;
      border-color: #16a34a;
    }

    label input:checked::after {
      content: '';
      position: absolute;
      left: 8px;
      top: 3px;
      width: 7px;
      height: 13px;
      border: solid #fff;
      border-width: 0 3px 3px 0;
      transform: rotate(45deg);
    }

    .hint {
      margin: 20px 0 8px;
      font-size: 14px;
      line-height: 1.7;
      color: #64748b;
    }

    .reason-input {
      display: block;
      width: calc(100% - 62px);
      height: 72px;
      max-height: 0;
      box-sizing: border-box;
      margin: 0 12px 0 50px;
      padding: 0 12px;
      border: 0 solid #22c55e;
      border-radius: 9px;
      background: rgba(255, 255, 255, .92);
      color: #1d1d1f;
      font: inherit;
      font-size: 15px;
      line-height: 1.5;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
      transform: translateY(-8px) scale(.98);
      box-shadow: 0 0 0 rgba(34, 197, 94, 0);

      transition:
        max-height .32s cubic-bezier(.22, 1, .36, 1),
        margin .32s cubic-bezier(.22, 1, .36, 1),
        padding .32s cubic-bezier(.22, 1, .36, 1),
        opacity .22s ease,
        transform .32s cubic-bezier(.22, 1, .36, 1),
        border-width .2s ease,
        box-shadow .3s ease,
        background-color .2s ease;
    }

    .reason-input::placeholder {
      color: #94a3b8;
      opacity: 1;
    }

    .reason-input.active {
      max-height: 120px;
      margin: -2px 12px 14px 50px;
      padding: 9px 12px;
      border-width: 2px;
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
      background: #fff;
      box-shadow:
        0 0 0 4px rgba(34, 197, 94, .20),
        0 5px 18px rgba(34, 197, 94, .16);
      resize: vertical;
      overflow: auto;
    }

    .reason-input:focus {
      outline: none;
    }

    @keyframes flashBorder {
      0% {
        transform: translateY(0) scale(1);
        box-shadow:
          0 0 0 0 rgba(34, 197, 94, 0),
          0 0 0 rgba(34, 197, 94, 0);
      }

      35% {
        transform: translateY(0) scale(1.012);
        box-shadow:
          0 0 0 6px rgba(34, 197, 94, .28),
          0 8px 28px rgba(34, 197, 94, .28);
      }

      100% {
        transform: translateY(0) scale(1);
        box-shadow:
          0 0 0 4px rgba(34, 197, 94, .20),
          0 5px 18px rgba(34, 197, 94, .16);
      }
    }

    .reason-input.flash {
      animation: flashBorder .7s cubic-bezier(.2, .8, .2, 1);
    }

    html[dir="rtl"] label {
      direction: rtl;
    }

    html[dir="rtl"] .reason-input {
      margin-left: 12px;
      margin-right: 50px;
      direction: rtl;
      text-align: right;
    }

    html[dir="rtl"] .reason-input.active {
      margin-left: 12px;
      margin-right: 50px;
    }

    #submit {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 16px auto 0;
      padding: 12px 85px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(
        135deg,
        #1a3a0a 0%,
        #35a52b 50%,
        #0f2a05 100%
      );
      background-size: 200% 200%;
      background-position: 0% center;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .3);
      transition:
        background-position .6s ease,
        box-shadow .4s ease,
        background-color .4s ease;
    }

    #submit::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, .15),
        transparent
      );
      transition: .5s;
    }

    #submit:hover:not(:disabled) {
      background-position: 100% center;
      animation: submit-glow-pulse 1.6s ease-in-out infinite;
    }

    #submit:hover:not(:disabled)::before {
      left: 100%;
    }

    #submit:active:not(:disabled) {
      background: #1c5c30;
      box-shadow: 0 2px 4px rgba(0, 0, 0, .5);
      transition: background .1s;
    }

    #submit:disabled {
      opacity: .5;
      cursor: default;
      animation: none;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .3);
    }

    @keyframes submit-glow-pulse {
      0%,
      100% {
        box-shadow:
          0 0 8px rgba(53, 165, 43, .5),
          0 0 20px rgba(53, 165, 43, .35),
          inset 0 0 12px rgba(255, 255, 255, .2);
      }

      50% {
        box-shadow:
          0 0 14px rgba(53, 165, 43, .8),
          0 0 36px rgba(53, 165, 43, .6),
          inset 0 0 18px rgba(255, 255, 255, .3);
      }
    }

    .openNotebook {
      width: 100%;
      background: linear-gradient(
        135deg,
        #1a3a0a 0%,
        #35a52b 50%,
        #0f2a05 100%
      );
      color: white;
      border: none;
      padding: 12px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition:
        background-position .6s ease,
        box-shadow .4s ease,
        border-color .4s ease,
        background-color .4s ease;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .3);
      position: relative;
      overflow: hidden;
    }

    #openNotebook:hover,
    #openNotebookSecondary:hover {
      background-position: 100% center;
      border-color: rgba(203, 213, 225, .8);
      animation: notebook-glow-pulse 1.6s ease-in-out infinite;
    }

    @keyframes notebook-glow-pulse {
      0%,
      100% {
        box-shadow:
          0 0 8px rgba(53, 165, 43, .5),
          0 0 20px rgba(53, 165, 43, .35),
          inset 0 0 12px rgba(255, 255, 255, .2);
      }

      50% {
        box-shadow:
          0 0 14px rgba(53, 165, 43, .8),
          0 0 36px rgba(53, 165, 43, .6),
          inset 0 0 18px rgba(255, 255, 255, .3);
      }
    }

    .openNotebook::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, .15),
        transparent
      );
      transition: .5s;
    }

    .openNotebook:hover::before {
      left: 100%;
    }

    .openNotebook:active {
      background: #1c5c30;
      box-shadow: 0 2px 4px rgba(0, 0, 0, .5);
      transition: background .1s;
    }

    .hp {
      position: absolute;
      left: -9999px;
    }

    @media (max-width: 600px) {
      .box {
        margin: 12px;
        padding: 26px 20px;
        border-radius: 18px;
      }

      .logo {
        width: 56px;
        height: 56px;
        border-radius: 13px;
        margin-bottom: 16px;
      }

      h2 {
        font-size: 19px;
        margin-bottom: 16px;
      }

      label {
        padding: 10px 8px;
        gap: 10px;
      }

      label input {
        width: 24px;
        height: 24px;
      }

      label input:checked::after {
        left: 7px;
        top: 2px;
        width: 6px;
        height: 12px;
      }

      .reason-input {
        width: calc(100% - 54px);
        margin-left: 44px;
        margin-right: 10px;
      }

      .reason-input.active {
        margin-left: 44px;
        margin-right: 10px;
      }

      html[dir="rtl"] .reason-input {
        margin-left: 10px;
        margin-right: 44px;
      }

      html[dir="rtl"] .reason-input.active {
        margin-left: 10px;
        margin-right: 44px;
      }

      #submit {
        width: auto;
        min-width: 150px;
        padding: 12px 55px;
      }
    }
  </style>
</head>

        p1: 'どのサイトですか？ここに URL を貼り付けてください…',
        o2: '無料で設定不要の AI を試してみませんか？（ヒント：Edge Copilot や Chrome のサイドバー AI は、今ではかなり高性能で、ウェブページを直接理解・分析できます。）',
        o3: '足りない機能がある',
        p3: 'どんな機能が必要でしたか？',
        hint: '',
        submit: '送信',
        thanks: 'またね！'
      },

      ko: {
        title: '삭제가 완료되었습니다. 여러분의 의견이 더 나은 서비스로 만드는 데 도움이 됩니다.',
        o1: '특정 사이트에서 번역이 작동하지 않음',
        p1: '어떤 사이트인가요? 여기에 URL을 붙여 넣어 주세요…',
        o2: '무료로 별도 설정 없이 사용할 수 있는 AI를 찾고 있나요? (팁: Edge Copilot과 Chrome 사이드바 AI는 이제 꽤 강력해서 웹페이지를 직접 이해하고 분석할 수 있습니다.)',
        o3: '기능이 부족함',
        p3: '어떤 기능이 필요했나요?',
        hint: '',
        submit: '제출',
        thanks: '또 만나요!'
      }
    };

    const RTL = ['ar', 'fa'];

    function pickLang(raw) {
      const l = (raw || 'en').toLowerCase();

      if (I18N[l]) {
        return l;
      }

      if (l.startsWith('zh')) {
        return 'zh-tw';
      }

      const p = l.split('-')[0];

      if (p === 'pt') {
        return 'pt-br';
      }

      return I18N[p] ? p : 'en';
    }

    const params = new URLSearchParams(location.search);
    const langKey = pickLang(
      params.get('browser_lang') || params.get('lang')
    );

    const t = I18N[langKey];

    document.documentElement.lang = langKey;
    document.documentElement.dir = RTL.includes(langKey) ? 'rtl' : 'ltr';
    document.title = 'Mira Translator';

    const REASONS = [
      {
        key: 'site_broken',
        text: t.o1,
        placeholder: t.p1
      },
      {
        key: 'want_free',
        text: t.o2,
        placeholder: ''
      },
      {
        key: 'missing_feature',
        text: t.o3,
        placeholder: t.p3
      }
    ];

    document.getElementById('title').textContent = t.title;
    document.getElementById('submit').textContent = 'OK';

    const reasonsEl = document.getElementById('reasons');

    REASONS.forEach((reason, i) => {
      const item = document.createElement('div');
      item.className = 'reason-item';

      const label = document.createElement('label');

      const input = document.createElement('input');
      input.type = 'checkbox';
      input.name = 'reason';
      input.value = reason.key;

      const span = document.createElement('span');
      span.textContent = `${i + 1}. ${reason.text}`;

      label.append(input, span);
      item.appendChild(label);

      if (
        reason.key === 'site_broken' ||
        reason.key === 'missing_feature'
      ) {
        const detailInput = document.createElement('textarea');

        detailInput.className = 'reason-input';
        detailInput.rows = 2;
        detailInput.dataset.reason = reason.key;
        detailInput.maxLength = 1000;
        detailInput.autocomplete = 'off';
        detailInput.placeholder = reason.placeholder;
        detailInput.setAttribute(
          'aria-label',
          reason.placeholder
        );

        item.appendChild(detailInput);
      }

      reasonsEl.appendChild(item);
    });

    reasonsEl.addEventListener('change', (e) => {
      if (!e.target.matches('input[name="reason"]')) {
        return;
      }

      const key = e.target.value;

      const detailInput = reasonsEl.querySelector(
        `.reason-input[data-reason="${key}"]`
      );

      if (!detailInput) {
        return;
      }

      if (e.target.checked) {
        detailInput.classList.add('active');
        detailInput.classList.remove('flash');

        void detailInput.offsetWidth;

        detailInput.classList.add('flash');

        requestAnimationFrame(() => {
          detailInput.focus();
        });
      } else {
        detailInput.classList.remove('active', 'flash');
      }
    });

    document.getElementById('submit').addEventListener('click', (e) => {
      if (document.getElementById('website').value) {
        return;
      }

      const reasons = [
        ...document.querySelectorAll(
          'input[name="reason"]:checked'
        )
      ].map(input => input.value);

      const comment = reasons
        .map(key => {
          const input = reasonsEl.querySelector(
            `.reason-input[data-reason="${key}"]`
          );

          return input ? input.value.trim() : '';
        })
        .filter(Boolean)
        .join(' ');

      if (!reasons.length && !comment) {
        return;
      }

      e.target.disabled = true;

      fetch(API, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=UTF-8'
        },
        keepalive: true,
        body: JSON.stringify({
          reasons,
          comment,
          client_id: params.get('client_id'),
          version: params.get('version'),
          days_used: Number(params.get('days_used')) || 0,
          minutes_used: Number(params.get('minutes_used')) || 0,
          usage_count: Number(params.get('usage_count')) || 0,
          browser: params.get('browser'),
          os: params.get('os'),
          browser_lang: params.get('browser_lang')
        })
      })
        .then(async (res) => {
          if (!res.ok) {
            console.error(
              'feedback failed:',
              res.status,
              await res.text()
            );
          }
        })
        .catch((err) => {
          console.error('feedback error:', err);
        });

      const box = document.getElementById('box');

      box.querySelectorAll(':scope > :not(.logo)').forEach(el => {
        el.remove();
      });

      const h = document.createElement('h2');
      h.textContent = t.thanks;

      box.appendChild(h);
    });
  </script>

</body>

</html>
