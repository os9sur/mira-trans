<script>
(() => {
  const API = 'https://mira-feedback.we35850.workers.dev/welcome-view';
  const pageOpenedAt = Math.round(performance.timeOrigin || (Date.now() - performance.now()));
  const ua = navigator.userAgent;
  let browser = 'chrome';
  if (/Firefox/i.test(ua)) browser = 'firefox';
  else if (/EdgA?\/|Edg\/|EdgiOS\//i.test(ua)) browser = 'edge';
  let os = 'Other';
  if (/Windows NT/i.test(ua)) os = 'Windows';
  else if (/Android/i.test(ua)) os = 'Android';
  else if (/iPhone|iPad|iPod/i.test(ua)) os = 'iOS';
  else if (/Macintosh|Mac OS X/i.test(ua)) os = 'macOS';
  else if (/Linux/i.test(ua)) os = 'Linux';
  const browserLang = navigator.language || 'en';
  const languages = ['zh-CN','zh-TW','zh-HK','ja','ko','en','es','fr','de','ru','pt-BR','it','tr','vi','th','ar','fa'];
  const baseLang = browserLang.split('-')[0].toLowerCase();
  const pageLang = languages.find(key => key.toLowerCase() === browserLang.toLowerCase()) || languages.find(key => key.toLowerCase().startsWith(baseLang)) || 'en';
  let referrer = '';
  try { if (document.referrer) referrer = new URL(document.referrer).hostname; } catch {}
  let visibleMilliseconds = 0;
  let visibleSince = document.visibilityState === 'visible' ? performance.now() : null;
  let submitted = false;
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      if (visibleSince === null) visibleSince = performance.now();
    } else if (visibleSince !== null) {
      visibleMilliseconds += performance.now() - visibleSince;
      visibleSince = null;
    }
  });
  function getDwellSeconds() {
    let milliseconds = visibleMilliseconds;
    if (visibleSince !== null) milliseconds += performance.now() - visibleSince;
    return Math.max(0, Math.floor(milliseconds / 1000));
  }
  function submitVisit() {
    if (submitted) return;
    submitted = true;
    const payload = { browser, os, browser_lang: browserLang, page_lang: pageLang, referrer, dwell_seconds: getDwellSeconds(), viewport_width: window.innerWidth, viewport_height: window.innerHeight, opened_at: pageOpenedAt };
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, keepalive: true, body: JSON.stringify(payload) }).catch(() => {});
  }
  window.addEventListener('pagehide', submitVisit, { once: true });
})();
</script>
