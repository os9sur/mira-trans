<!DOCTYPE html>
<html lang="en">

<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-H2MZR2NP56"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-H2MZR2NP56');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Mira</title>
  <link rel="icon" href="favicon.ico">
  <style>
    :root {
      --bg-main: #0b0f19;
      --card-bg: rgba(30, 41, 59, 0.45);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-gradient: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      --glow-color: rgba(6, 182, 212, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .glow-bg {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, transparent 70%);
      z-index: 0;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .box {
      position: relative;
      z-index: 1;
      text-align: center;
      width: fit-content;
      max-width: 95vw;

      /* 整体尽量占满高度 */
      height: 92vh;
      max-height: 92vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(8px, 1.5vh, 20px);

      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      padding: clamp(16px, 2.5vh, 40px) clamp(16px, 3vw, 40px);

      box-shadow:
        0 0 60px -10px var(--glow-color),
        0 30px 60px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.1);

      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    @keyframes slideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex-shrink: 0;
    }

    .header img {
      width: clamp(48px, 8vh, 70px);
      height: clamp(48px, 8vh, 70px);
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
    }

    h1 {
      font-size: clamp(20px, 4vh, 36px);
      font-weight: 700;
      line-height: 1.2;
      background: var(--text-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      h1 {
        white-space: normal;
        text-align: center;
      }

      .header {
        flex-direction: column;
        gap: 12px;
      }
    }

    /* Pin 图钉 */
    .pin-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .pin-bg {
      font-size: clamp(28px, 5vh, 43px);
      filter: hue-rotate(65deg) contrast(1.1) saturate(1.8) brightness(1.3) drop-shadow(0 15px 20px rgba(0, 0, 0, 0.5));
      animation: floatUp 3s infinite ease-in-out;
      display: inline-block;
      user-select: none;
    }

    @keyframes floatUp {

      0%,
      100% {
        transform: translateY(0) rotate(-5deg);
      }

      50% {
        transform: translateY(-15px) rotate(5deg);
      }
    }

    .gif-wrap {
      border-radius: 20px;
      position: relative;
      padding: 6px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.02) 100%);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);

      flex: 1 1 auto;
      /* 自动伸展，占满 box 里剩下的所有空间 */
      min-height: 0;
      /* 清零，让 flex 子项 s收缩/伸展 */
      width: 100%;
      display: flex;
    }

    .gif-inner {
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    .gif-inner img,
    .gif-inner video {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      display: block;
      border-radius: 16px;
      object-fit: contain;
    }

    @media (max-width: 600px) {
      h1 {
        white-space: normal;
        text-align: center;
      }

      .header {
        flex-direction: column;
        gap: 12px;
      }
    }

    .gif-inner {
      position: relative;
    }

    .play-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: rgba(6, 182, 212, 0.5);
      border: 2px solid rgba(56, 189, 248, 0.9);
      color: #fff;
      font-size: 30px;
      cursor: pointer;
      display: none;
      padding-left: 6px;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      box-shadow:
        0 0 0 0 rgba(56, 189, 248, 0.6),
        0 8px 24px rgba(0, 0, 0, 0.5);
      animation: pulseGlow 1.8s infinite ease-out;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .play-overlay:hover {
      background: rgba(6, 182, 212, 0.55);
      transform: translate(-50%, -50%) scale(1.1);
    }

    @keyframes pulseGlow {
      0% {
        box-shadow:
          0 0 0 0 rgba(56, 189, 248, 0.6),
          0 8px 24px rgba(0, 0, 0, 0.5);
      }

      70% {
        box-shadow:
          0 0 0 20px rgba(56, 189, 248, 0),
          0 8px 24px rgba(0, 0, 0, 0.5);
      }

      100% {
        box-shadow:
          0 0 0 0 rgba(56, 189, 248, 0),
          0 8px 24px rgba(0, 0, 0, 0.5);
      }
    }

    .play-overlay:hover {
      background: rgba(0, 0, 0, 0.75);
      transform: translate(-50%, -50%) scale(1.08);
    }

    .progress-wrap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      cursor: pointer;
      z-index: 2;
      transition: height 0.15s ease;
      touch-action: none; 
    }

    .progress-wrap:hover,
    .progress-wrap.dragging {
      height: 10px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #06b6d4, #38bdf8);
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
      transition: width 0.1s linear;
    }

    .progress-handle {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.4), 0 0 10px rgba(56, 189, 248, 0.9);
      transform: translate(-50%, -50%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      z-index: 3;
    }

    .progress-wrap:hover .progress-handle,
    .progress-wrap.dragging .progress-handle {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div class="glow-bg"></div>

  <div class="box">

    <!-- 顶部：Logo + 放大文字 -->
    <div class="header">
      <img src="logo.png" alt="Mira">
      <h1 id="title" dir="auto"></h1>
    </div>

    <!-- 中间：浮动图钉 -->
    <div class="pin-wrap">
      <div class="pin-bg">📌</div>
    </div>

    <!-- 底部：预览图 -->
    <div class="gif-wrap">
      <div class="gif-inner">
        <video id="guide-gif" muted loop playsinline></video>
        <button id="play-overlay" class="play-overlay" aria-label="Play">▶</button>

        <!--  播放进度条 -->
        <div id="progress-wrap" class="progress-wrap">
          <div id="progress-bar" class="progress-bar"></div>
          <div id="progress-handle" class="progress-handle"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const lang = navigator.language || 'en';
    const i18n = {
      'zh-CN': {
        font: "'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif",
        title: '最后一步：将 Mira 固定到工具栏'
      },
      'zh-TW': {
        font: "'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif",
        title: '最後一步：將 Mira 固定到工具列'
      },
      'zh-HK': {
        font: "'PingFang HK', 'PingFang TC', 'Microsoft JhengHei', sans-serif",
        title: '最後一步：將 Mira 固定到工具列'
      },
      'ja': {
        font: "'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif",
        title: '最後のステップ：Mira をツールバーに固定'
      },
      'ko': {
        font: "'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif",
        title: '마지막 단계: Mira를 툴바에 고정하세요'
      },
      'en': {
        font: "system-ui, -apple-system, sans-serif",
        title: 'Last step: Pin Mira to your toolbar'
      },

      'es': {
        font: "system-ui, -apple-system, sans-serif",
        title: 'Último paso: fija Mira en la barra de herramientas'
      },
      'fr': {
        font: "system-ui, -apple-system, sans-serif",
        title: 'Dernière étape : épinglez Mira à la barre d’outils'
      },
      'de': {
        font: "system-ui, -apple-system, sans-serif",
        title: 'Letzter Schritt: Mira an die Symbolleiste anheften'
      },
      'ru': {
        font: "system-ui, -apple-system, sans-serif",
        title: 'Последний шаг: закрепите Mira на панели инструментов'
      },
      'pt-BR': {
        font: "system-ui, -apple-system, sans-serif",
        title: 'Último passo: fixe o Mira na barra de ferramentas'
      },
      'it': {
        font: "system-ui, -apple-system, sans-serif",
        title: 'Ultimo passaggio: aggiungi Mira alla barra degli strumenti'
      },
      'tr': {
        font: "system-ui, -apple-system, sans-serif",
        title: 'Son adım: Mira’yı araç çubuğuna sabitleyin'
      },
      'vi': {
        font: "system-ui, -apple-system, sans-serif",
        title: 'Bước cuối: ghim Mira vào thanh công cụ'
      },
      'th': {
        font: "system-ui, -apple-system, sans-serif",
        title: 'ขั้นตอนสุดท้าย: ปักหมุด Mira ไว้ที่แถบเครื่องมือ'
      },
      'ar': {
        font: "system-ui, -apple-system, sans-serif",
        title: 'الخطوة الأخيرة: ثبّت Mira في شريط الأدوات'
      },
      'fa': {
        font: "system-ui, -apple-system, sans-serif",
        title: 'مرحله آخر: Mira را به نوار ابزار سنجاق کنید'
      },
    };

    function getStrings() {
      if (i18n[lang]) return i18n[lang];
      const prefix = lang.split('-')[0];
      const match = Object.keys(i18n).find(k => k.startsWith(prefix));
      return i18n[match] || i18n['en'];
    }

    const ua = navigator.userAgent;
    let browser = 'chrome';
    if (ua.includes('Firefox')) browser = 'firefox';
    else if (ua.includes('Edg/')) browser = 'edge';

    const gifMap = {
      chrome: 'welcome-chrome.mp4',
      edge: 'welcome-edge.mp4',
      firefox: 'welcome-firefox.mp4',
    };

    const s = getStrings();
    document.body.style.fontFamily = s.font;
    document.getElementById('title').textContent = s.title;

    const video = document.getElementById('guide-gif');
    const playOverlay = document.getElementById('play-overlay');

    video.muted = true;
    video.playsInline = true;
    video.src = gifMap[browser];
    video.load();

    let hasPlayed = false;

    function attemptPlay() {
      if (hasPlayed) return;
      const playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise
          .then(() => {
            hasPlayed = true;
            playOverlay.style.display = 'none';
            removeGestureListeners();
          })
          .catch(() => {
            playOverlay.style.display = 'flex';
          });
      }
    }

    function onUserGesture() {
      attemptPlay();
    }

    function removeGestureListeners() {
      document.removeEventListener('pointerdown', onUserGesture);
      document.removeEventListener('keydown', onUserGesture);
      document.removeEventListener('touchstart', onUserGesture);
    }

    document.addEventListener('pointerdown', onUserGesture);
    document.addEventListener('keydown', onUserGesture);
    document.addEventListener('touchstart', onUserGesture);

    playOverlay.addEventListener('click', () => {
      video.play();
      hasPlayed = true;
      playOverlay.style.display = 'none';
      removeGestureListeners();
    });

    video.addEventListener('loadedmetadata', attemptPlay);

    // 视频只要暂停(不管什么原因导致),就显示播放按钮兜底
    video.addEventListener('pause', () => {
      if (!video.ended) {
        playOverlay.style.display = 'flex';
      }
    });

    // 视频恢复播放时隐藏按钮
    video.addEventListener('play', () => {
      playOverlay.style.display = 'none';
    });

    // 页面从"不可见"(被遮挡/最小化/切走)变回可见时,自动重试播放
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && video.paused) {
        hasPlayed = false;  
        attemptPlay();
      }
    });
 
    window.addEventListener('resize', () => {
      if (video.paused) {
        hasPlayed = false;
        attemptPlay();
      }
    });
    const progressWrap = document.getElementById('progress-wrap');
    const progressBar = document.getElementById('progress-bar');

    // 播放进度更新
    video.addEventListener('timeupdate', () => {
      if (!video.duration) return;
      const pct = (video.currentTime / video.duration) * 100;
      progressBar.style.width = pct + '%';
    });

    video.addEventListener('ended', () => {
      progressBar.style.width = '100%';
    });

    // 点击进度条跳转
    const progressHandle = document.getElementById('progress-handle');

    let isDragging = false;

    function setProgressUI(ratio) {
      const pct = Math.min(Math.max(ratio, 0), 1) * 100;
      progressBar.style.width = pct + '%';
      progressHandle.style.left = pct + '%';
    }
 
    video.addEventListener('timeupdate', () => {
      if (isDragging || !video.duration) return;
      setProgressUI(video.currentTime / video.duration);
    });

    video.addEventListener('ended', () => {
      setProgressUI(1);
    });

    function ratioFromEvent(e) {
      const rect = progressWrap.getBoundingClientRect();
      const x = e.clientX - rect.left;
      return Math.min(Math.max(x / rect.width, 0), 1);
    }
 
    function startDrag(e) {
      if (!video.duration) return;
      isDragging = true;

      progressWrap.classList.add('dragging');
      progressBar.style.transition = 'none';  

      setProgressUI(ratioFromEvent(e));
      progressWrap.setPointerCapture(e.pointerId);
      e.stopPropagation();  
    }

    function duringDrag(e) {
      if (!isDragging) return;
      const ratio = ratioFromEvent(e);
      setProgressUI(ratio);  

      requestAnimationFrame(() => {
        if (isDragging) video.currentTime = ratio * video.duration;
      });
    }

    function endDrag(e) {
      if (!isDragging) return;
      isDragging = false;
      progressWrap.classList.remove('dragging');
      progressBar.style.transition = ''; // 恢复正常过渡

      const ratio = ratioFromEvent(e);
      video.currentTime = ratio * video.duration; 
    }

    progressWrap.addEventListener('pointerdown', startDrag);
    window.addEventListener('pointermove', duringDrag);
    window.addEventListener('pointerup', endDrag);
 
    function togglePlay() {
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    }

    video.addEventListener('click', togglePlay);
    playOverlay.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePlay();
    });
 
    video.addEventListener('pause', () => {
      playOverlay.style.display = 'flex';
    });
    video.addEventListener('play', () => {
      playOverlay.style.display = 'none';
    });
  </script>
</body>

</html>
