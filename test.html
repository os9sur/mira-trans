<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Feedback Admin</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f8fafc; color: #1e293b; }
    .bar { display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
    input:not([type="checkbox"]) { padding:8px 10px; border:1px solid #cbd5e1; border-radius:8px; font:inherit; min-width:280px; }
    input[type="checkbox"] { width:16px; height:16px; min-width:16px; margin:0; accent-color:#2563eb; cursor:pointer; }
    button { padding:8px 16px; border:0; border-radius:8px; background:#2563eb; color:#fff; font:inherit; cursor:pointer; transition:background .15s, opacity .15s; }
    button:hover:not(:disabled) { background:#1d4ed8; }
    button:disabled { opacity:.45; cursor:default; }
    .delete-btn { padding:6px 12px; background:#dc2626; white-space:nowrap; }
    .delete-btn:hover:not(:disabled) { background:#b91c1c; }
    #info { color:#64748b; font-size:14px; overflow-wrap:anywhere; }
    .tabs { display:flex; gap:8px; margin-bottom:16px; border-bottom:1px solid #e2e8f0; }
    .tab { padding:11px 20px; color:#64748b; background:transparent; border-radius:8px 8px 0 0; border-bottom:3px solid transparent; font-weight:600; }
    .tab:hover:not(:disabled) { color:#1d4ed8; background:#eff6ff; }
    .tab.active { color:#2563eb; background:#eff6ff; border-bottom-color:#2563eb; }
    .panel[hidden] { display:none; }
    .wrap { overflow-x:auto; background:#fff; border-radius:12px; box-shadow:0 4px 16px rgba(0,0,0,.06); }
    table { border-collapse:collapse; width:100%; font-size:14px; }
    th, td { padding:10px 12px; text-align:left; border-bottom:1px solid #e2e8f0; vertical-align:top; }
    th { background:#f1f5f9; white-space:nowrap; }
    tbody tr:hover { background:#f8fafc; }
    td.c { min-width:260px; white-space:pre-wrap; word-break:break-word; }
    td.action, td.select-cell { white-space:nowrap; }
    td.select-cell { width:42px; text-align:center; }
    th.select-head { width:42px; text-align:center; }
    .tag { display:inline-block; margin:0 4px 4px 0; padding:2px 8px; border-radius:999px; background:#e0e7ff; color:#3730a3; font-size:12px; white-space:nowrap; }
    .summary { display:grid; grid-template-columns:repeat(3,minmax(150px,1fr)); gap:12px; margin-bottom:18px; }
    .summary-card { min-width:0; padding:16px 18px; background:#fff; border:1px solid #e2e8f0; border-radius:12px; box-shadow:0 3px 12px rgba(0,0,0,.035); }
    .summary-label { color:#64748b; font-size:13px; }
    .summary-value { margin-top:6px; font-size:26px; line-height:1.2; font-weight:700; color:#0f172a; overflow-wrap:anywhere; }
    .section-title { margin:22px 0 10px; font-size:16px; font-weight:650; }
    .section-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:22px 0 10px; }
    .section-heading .section-title { margin:0; }
    .collapse-btn { display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border:1px solid #cbd5e1; border-radius:8px; background:#e2e8f0; color:#334155; font-size:13px; white-space:nowrap; }
    .collapse-btn:hover:not(:disabled) { background:#cbd5e1; }
    .collapse-icon { font-size:12px; line-height:1; }
    #city-stats-panel[hidden] { display:none; }
    .pagination { display:flex; justify-content:center; align-items:center; gap:12px; margin-top:14px; }
    .empty { padding:28px; text-align:center; color:#94a3b8; }
    .bulk-bar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:0 0 10px; padding:10px 12px; border:1px solid #e2e8f0; border-radius:10px; background:#fff; }
    .select-all-label { display:inline-flex; align-items:center; gap:8px; font-size:14px; color:#334155; cursor:pointer; user-select:none; }
    .selected-count { color:#64748b; font-size:13px; }
    .bulk-bar .delete-btn { margin-left:auto; padding:7px 14px; }
    @media (max-width:600px) {
      body { padding:14px; }
      input:not([type="checkbox"]) { min-width:0; width:100%; }
      .summary { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .tab { flex:1; padding:10px 8px; }
      .bulk-bar .delete-btn { margin-left:0; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <input id="token" type="password" placeholder="ADMIN_TOKEN" autocomplete="current-password">
    <button id="load">加载</button>
    <span id="info" role="status" aria-live="polite"></span>
  </div>

  
  <div class="tabs" role="tablist" aria-label="管理数据">
    <button class="tab active" id="tab-welcome" role="tab" aria-selected="true" aria-controls="panel-welcome" data-tab="welcome">欢迎页访问</button>
    <button class="tab" id="tab-uninstall" role="tab" aria-selected="false" aria-controls="panel-uninstall" data-tab="uninstall">卸载页访问</button>
    <button class="tab" id="tab-feedback" role="tab" aria-selected="false" aria-controls="panel-feedback" data-tab="feedback">卸载反馈</button>
  </div>
 
  <section class="panel" id="panel-welcome" role="tabpanel" aria-labelledby="tab-welcome">
    <div class="summary">
      <div class="summary-card"><div class="summary-label">访问记录</div><div class="summary-value" id="welcome-total">—</div></div>
      <div class="summary-card"><div class="summary-label">有城市信息的记录</div><div class="summary-value" id="welcome-geolocated">—</div></div>
      <div class="summary-card"><div class="summary-label">不同城市</div><div class="summary-value" id="welcome-cities">—</div></div>
    </div>
    <div class="section-heading">
      <h3 class="section-title">访问城市排行</h3>
      <button type="button" class="collapse-btn" id="toggle-city-stats" aria-expanded="false" aria-controls="city-stats-panel">
        <span class="collapse-label">展开</span><span class="collapse-icon" aria-hidden="true">▸</span>
      </button>
    </div>
    <div id="city-stats-panel" hidden>
      <div class="wrap">
        <table><thead><tr><th>城市</th><th>地区</th><th>国家</th><th>访问次数</th></tr></thead><tbody id="city-rows"></tbody></table>
      </div>
    </div>
    <h3 class="section-title">访问记录明细</h3>
    <div class="bulk-bar">
      <label class="select-all-label"><input type="checkbox" id="welcome-select-all"> 全选全部欢迎页访问记录（包含其他页）</label>
      <span id="welcome-selected-count" class="selected-count">已选择 0 条</span>
      <button id="welcome-bulk-delete" class="delete-btn" disabled>删除所选</button>
    </div>
    <div class="wrap">
      <table>
        <thead><tr>
          <th class="select-head">选择</th><th>时间</th><th>停留时间</th><th>设备类型</th><th>视口宽度</th><th>视口高度</th>
          <th>城市</th><th>地区</th><th>国家</th><th>ASN</th><th>网络组织</th><th>时区</th><th>浏览器</th><th>系统</th><th>浏览器语言</th><th>页面语言</th><th>操作</th>
        </tr></thead>
        <tbody id="welcome-rows"></tbody>
      </table>
    </div>
    <div class="pagination"><button id="welcome-prev">上一页</button><span id="welcome-pageinfo"></span><button id="welcome-next">下一页</button></div>
  </section>
 
  <section class="panel" id="panel-uninstall" role="tabpanel" aria-labelledby="tab-uninstall" hidden>
    <div class="summary">
      <div class="summary-card"><div class="summary-label">访问记录</div><div class="summary-value" id="uninstall-total">—</div></div>
      <div class="summary-card"><div class="summary-label">有城市信息的记录</div><div class="summary-value" id="uninstall-geolocated">—</div></div>
      <div class="summary-card"><div class="summary-label">不同城市</div><div class="summary-value" id="uninstall-cities">—</div></div>
    </div>
    <h3 class="section-title">卸载页访问记录明细</h3>
    <div class="bulk-bar">
      <label class="select-all-label"><input type="checkbox" id="uninstall-select-all"> 全选全部卸载页访问记录（包含其他页）</label>
      <span id="uninstall-selected-count" class="selected-count">已选择 0 条</span>
      <button id="uninstall-bulk-delete" class="delete-btn" disabled>删除所选</button>
    </div>
    <div class="wrap">
      <table>
        <thead><tr>
          <th class="select-head">选择</th><th>时间</th><th>停留时间</th><th>设备类型</th><th>视口宽度</th><th>视口高度</th>
          <th>城市</th><th>地区</th><th>国家</th><th>ASN</th><th>网络组织</th><th>时区</th><th>浏览器</th><th>浏览器版本</th><th>系统</th><th>浏览器语言</th><th>操作</th>
        </tr></thead>
        <tbody id="uninstall-rows"></tbody>
      </table>
    </div>
    <div class="pagination"><button id="uninstall-prev">上一页</button><span id="uninstall-pageinfo"></span><button id="uninstall-next">下一页</button></div>
  </section>
 
  <section class="panel" id="panel-feedback" role="tabpanel" aria-labelledby="tab-feedback" hidden>
    <div class="bulk-bar">
      <label class="select-all-label"><input type="checkbox" id="feedback-select-all"> 全选全部卸载反馈（包含其他页）</label>
      <span id="feedback-selected-count" class="selected-count">已选择 0 条</span>
      <button id="feedback-bulk-delete" class="delete-btn" disabled>删除所选</button>
    </div>
    <div class="wrap">
      <table>
        <thead><tr>
          <th class="select-head">选择</th><th>时间</th><th>停留时间</th><th>设备类型</th><th>视口宽度</th><th>视口高度</th>
          <th>原因</th><th>留言</th><th>语言</th><th>国家</th><th>城市</th><th>浏览器</th><th>浏览器版本</th><th>系统</th><th>操作</th>
        </tr></thead>
        <tbody id="feedback-rows"></tbody>
      </table>
    </div>
    <div class="pagination"><button id="feedback-prev">上一页</button><span id="feedback-pageinfo"></span><button id="feedback-next">下一页</button></div>
  </section>

  <script>
    const API_BASE = 'https://mira-feedback.we35850.workers.dev';
    const PAGE_SIZE = 20;
    const LABELS = {
      site_broken: '网站失效',
      want_free: '想要免费',
      missing_feature: '缺少功能',
      other_reason: '其他原因',
      prefer_not_to_answer: '不想回答'
    };
    const DEVICE_LABELS = { desktop: '桌面', mobile: '手机', tablet: '平板' };
    const CONFIG = {
      welcome: { label: '欢迎页访问', listPath: '/admin/welcome-list', colSpan: 17 },
      uninstall: { label: '卸载页访问', listPath: '/admin/uninstall-list', colSpan: 17 },
      feedback: { label: '卸载反馈', listPath: '/admin/list', colSpan: 15 }
    };
    const tokenEl = document.getElementById('token');
    const infoEl = document.getElementById('info');
    tokenEl.value = localStorage.getItem('adm') || '';

    // 每次刷新都从欢迎页访问标签开始。
    let activeTab = 'welcome';
    const rows = { welcome: [], uninstall: [], feedback: [] };
    const pages = { welcome: 0, uninstall: 0, feedback: 0 };
    const loaded = { welcome: false, uninstall: false, feedback: false };
    const selected = { welcome: new Set(), uninstall: new Set(), feedback: new Set() };
    const batchDeleting = { welcome: false, uninstall: false, feedback: false };
    const countryDisplay = new Intl.DisplayNames(['zh'], { type: 'region' });

    function countryName(code) {
      if (!code) return '';
      try { return countryDisplay.of(code) || code; } catch { return code; }
    }
    function cell(value, className) {
      const td = document.createElement('td');
      if (className) td.className = className;
      td.textContent = value == null ? '' : String(value);
      return td;
    }
    function emptyRow(tbody, colspan, message = '暂无记录') {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = colspan;
      td.className = 'empty';
      td.textContent = message;
      tr.appendChild(td);
      tbody.appendChild(tr);
    }
    function formatDwell(record) {
      return record.dwell_seconds == null ? '—' : `${record.dwell_seconds} 秒`;
    }
    function formatDimension(value) {
      return value == null ? '—' : `${value} px`;
    }
    function formatDevice(record) {
      return DEVICE_LABELS[record.device_type] || record.device_type || '—';
    }
    function getRecordKey(record) {
      return record.kv_key == null ? '' : String(record.kv_key);
    }
    function updateSelectionUI(type) {
      const selectableCount = rows[type].filter(getRecordKey).length;
      const selectedCount = rows[type].filter(record => {
        const key = getRecordKey(record);
        return key && selected[type].has(key);
      }).length;
      const allCheckbox = document.getElementById(type + '-select-all');
      const countEl = document.getElementById(type + '-selected-count');
      const deleteButton = document.getElementById(type + '-bulk-delete');
      allCheckbox.checked = selectableCount > 0 && selectedCount === selectableCount;
      allCheckbox.indeterminate = selectedCount > 0 && selectedCount < selectableCount;
      allCheckbox.disabled = selectableCount === 0 || batchDeleting[type];
      countEl.textContent = `已选择 ${selectedCount} / ${selectableCount} 条`;
      deleteButton.disabled = selectedCount === 0 || batchDeleting[type];
      deleteButton.textContent = batchDeleting[type] ? '正在删除…' : '删除所选';
    }
    function createSelectCell(type, record) {
      const td = document.createElement('td');
      td.className = 'select-cell';
      const key = getRecordKey(record);
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = !!key && selected[type].has(key);
      checkbox.disabled = !key || batchDeleting[type];
      checkbox.setAttribute('aria-label', '选择此条记录');
      checkbox.addEventListener('change', () => {
        if (checkbox.checked) selected[type].add(key);
        else selected[type].delete(key);
        updateSelectionUI(type);
      });
      td.appendChild(checkbox);
      return td;
    }
    function createDeleteButton(type, record) {
      const button = document.createElement('button');
      button.className = 'delete-btn';
      button.textContent = '删除';
      button.addEventListener('click', () => deleteRecord(type, record, button));
      return button;
    }
    async function apiRequest(path, options = {}) {
      const headers = {
        ...(options.headers || {}),
        Authorization: 'Bearer ' + tokenEl.value.trim()
      };
      const res = await fetch(API_BASE + path, { ...options, headers });
      const data = await res.json().catch(() => null);
      if (!res.ok) {
        const error = new Error(data?.reason || (res.status === 401 ? '管理口令不正确' : `请求失败：${res.status}`));
        error.status = res.status;
        throw error;
      }
      return data;
    }
    function showError(prefix, error) {
      infoEl.textContent = error.status === 401
        ? prefix + '：管理口令不正确'
        : prefix + '：' + error.message;
    }
    async function loadData(type) {
      infoEl.textContent = `正在加载${CONFIG[type].label}…`;
      try {
        const data = await apiRequest(CONFIG[type].listPath);
        rows[type] = Array.isArray(data.rows) ? data.rows : [];
        rows[type].sort((a, b) => (b.ts || 0) - (a.ts || 0));
        pages[type] = 0;
        loaded[type] = true;
        const valid = new Set(rows[type].map(getRecordKey).filter(Boolean));
        for (const key of selected[type]) if (!valid.has(key)) selected[type].delete(key);
        localStorage.setItem('adm', tokenEl.value.trim());
        render(type);
        infoEl.textContent = `${CONFIG[type].label}：${rows[type].length} 条`;
      } catch (error) {
        showError(`加载${CONFIG[type].label}失败`, error);
      }
    }
    function renderCityStats(type) {
      const groups = new Map();
      let geolocated = 0;
      rows[type].forEach(record => {
        const city = record.city || '';
        const region = record.region || '';
        const country = record.country || '';
        if (city) geolocated++;
        const key = JSON.stringify([country, region, city]);
        if (!groups.has(key)) groups.set(key, { city: city || '未知城市', region, country, count: 0 });
        groups.get(key).count++;
      });
      const locations = [...groups.values()].sort((a, b) => b.count - a.count);
      const prefix = type === 'welcome' ? 'welcome' : 'uninstall';
      document.getElementById(prefix + '-total').textContent = rows[type].length.toLocaleString();
      document.getElementById(prefix + '-geolocated').textContent = geolocated.toLocaleString();
      document.getElementById(prefix + '-cities').textContent = new Set(
        rows[type].filter(record => record.city).map(record => JSON.stringify([record.country || '', record.region || '', record.city]))
      ).size.toLocaleString();

      if (type === 'welcome') {
        const tbody = document.getElementById('city-rows');
        tbody.replaceChildren();
        if (!locations.length) { emptyRow(tbody, 4); return; }
        locations.slice(0, 20).forEach(location => {
          const tr = document.createElement('tr');
          tr.appendChild(cell(location.city));
          tr.appendChild(cell(location.region));
          tr.appendChild(cell(countryName(location.country)));
          tr.appendChild(cell(location.count));
          tbody.appendChild(tr);
        });
      }
    }
    function appendReasonCell(tr, record) {
      const td = document.createElement('td');
      (record.reasons || []).forEach(reason => {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = LABELS[reason] || reason;
        td.appendChild(tag);
      });
      tr.appendChild(td);
    }
    function render(type) {
      const tbody = document.getElementById(type + '-rows');
      const totalPages = Math.max(1, Math.ceil(rows[type].length / PAGE_SIZE));
      pages[type] = Math.min(Math.max(pages[type], 0), totalPages - 1);
      tbody.replaceChildren();

      if (type === 'welcome' || type === 'uninstall') renderCityStats(type);

      const start = pages[type] * PAGE_SIZE;
      const currentRows = rows[type].slice(start, start + PAGE_SIZE);
      if (!currentRows.length) emptyRow(tbody, CONFIG[type].colSpan);

      currentRows.forEach(record => {
        const tr = document.createElement('tr');
        tr.appendChild(createSelectCell(type, record));

        tr.appendChild(cell(record.ts ? new Date(record.ts).toLocaleString() : ''));
        tr.appendChild(cell(formatDwell(record)));
        tr.appendChild(cell(formatDevice(record)));
        tr.appendChild(cell(formatDimension(record.viewport_width)));
        tr.appendChild(cell(formatDimension(record.viewport_height)));

        if (type === 'welcome') {
          tr.appendChild(cell(record.city));
          tr.appendChild(cell(record.region));
          tr.appendChild(cell(countryName(record.country)));
          tr.appendChild(cell(record.asn == null ? '—' : record.asn));
          tr.appendChild(cell(record.as_organization || '—'));
          tr.appendChild(cell(record.timezone));
          tr.appendChild(cell(record.browser));
          tr.appendChild(cell(record.os));
          tr.appendChild(cell(record.browser_lang));
          tr.appendChild(cell(record.page_lang));
        } else if (type === 'uninstall') {
          tr.appendChild(cell(record.city));
          tr.appendChild(cell(record.region));
          tr.appendChild(cell(countryName(record.country)));
          tr.appendChild(cell(record.asn == null ? '—' : record.asn));
          tr.appendChild(cell(record.as_organization || '—'));
          tr.appendChild(cell(record.timezone));
          tr.appendChild(cell(record.browser));
          tr.appendChild(cell(record.browser_version));
          tr.appendChild(cell(record.os));
          tr.appendChild(cell(record.browser_lang));
        } else {
          appendReasonCell(tr, record);
          tr.appendChild(cell(record.comment, 'c'));
          tr.appendChild(cell(record.browser_lang));
          tr.appendChild(cell(countryName(record.country)));
          tr.appendChild(cell(record.city));
          tr.appendChild(cell(record.browser));
          tr.appendChild(cell(record.browser_version));
          tr.appendChild(cell(record.os));
        }

        const action = cell('');
        action.className = 'action';
        action.appendChild(createDeleteButton(type, record));
        tr.appendChild(action);
        tbody.appendChild(tr);
      });

      document.getElementById(type + '-pageinfo').textContent = `${pages[type] + 1} / ${totalPages}`;
      document.getElementById(type + '-prev').disabled = pages[type] === 0;
      document.getElementById(type + '-next').disabled = pages[type] >= totalPages - 1;
      updateSelectionUI(type);
    }
    function deletePayload(type, record) {
      return { type, key: record.kv_key };
    }
    async function deleteRecord(type, record, button) {
      if (!record.kv_key) {
        alert('缺少 KV 记录键，无法删除。请更新 Worker 的列表接口。');
        return;
      }
      const description = type === 'feedback'
        ? `留言：${String(record.comment || '').trim().slice(0, 120) || '（无留言）'}\n浏览器：${record.browser || '未知'}\n国家：${countryName(record.country) || '未知'}`
        : `城市：${record.city || '未知'}\n国家：${countryName(record.country) || '未知'}\n时间：${record.ts ? new Date(record.ts).toLocaleString() : ''}`;
      if (!confirm(`确定删除这条${CONFIG[type].label}吗？此操作不可撤销。\n\n${description}`)) return;
      button.disabled = true;
      infoEl.textContent = '正在删除…';
      try {
        const data = await apiRequest('/admin/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(deletePayload(type, record))
        });
        if (!data?.ok) throw new Error(data?.reason || '删除失败');
        selected[type].delete(getRecordKey(record));
        rows[type] = rows[type].filter(item => item.kv_key !== record.kv_key);
        render(type);
        infoEl.textContent = `${CONFIG[type].label}已删除，剩余 ${rows[type].length} 条`;
      } catch (error) {
        showError('删除失败', error);
      } finally {
        if (button.isConnected) button.disabled = false;
      }
    }
    async function deleteSelected(type) {
      const records = rows[type].filter(record => {
        const key = getRecordKey(record);
        return key && selected[type].has(key);
      });
      if (!records.length || batchDeleting[type]) return;
      if (!confirm(`确定删除选中的 ${records.length} 条${CONFIG[type].label}吗？\n\n删除操作不可撤销。`)) return;

      batchDeleting[type] = true;
      updateSelectionUI(type);
      let succeeded = 0, failed = 0, stoppedForAuth = false, lastError = '';

      for (let i = 0; i < records.length; i++) {
        const record = records[i];
        infoEl.textContent = `正在批量删除${CONFIG[type].label}：${i + 1} / ${records.length}…`;
        try {
          const data = await apiRequest('/admin/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(deletePayload(type, record))
          });
          if (!data?.ok) throw new Error(data?.reason || '删除失败');
          selected[type].delete(getRecordKey(record));
          rows[type] = rows[type].filter(item => item.kv_key !== record.kv_key);
          succeeded++;
        } catch (error) {
          failed++;
          lastError = error.message || '请求失败';
          if (error.status === 401) { stoppedForAuth = true; break; }
        }
      }

      const notAttempted = records.length - succeeded - failed;
      batchDeleting[type] = false;
      render(type);
      let message = `批量删除完成：成功 ${succeeded} 条，失败 ${failed} 条`;
      if (notAttempted > 0) message += `，另有 ${notAttempted} 条未处理`;
      if (stoppedForAuth) message += '；管理口令不正确，已停止后续操作';
      else if (lastError && failed) message += `；${lastError}`;
      infoEl.textContent = message;
    }
    function loadActiveTab() { loadData(activeTab); }
    function switchTab(type) {
      activeTab = type;
      for (const name of Object.keys(CONFIG)) {
        const active = name === type;
        document.getElementById('tab-' + name).classList.toggle('active', active);
        document.getElementById('tab-' + name).setAttribute('aria-selected', String(active));
        document.getElementById('panel-' + name).hidden = !active;
      }
      if (!loaded[type]) loadData(type);
      else infoEl.textContent = `${CONFIG[type].label}：${rows[type].length} 条`;
    }

    document.querySelectorAll('[data-tab]').forEach(button => {
      button.addEventListener('click', () => switchTab(button.dataset.tab));
    });
    const cityStatsToggle = document.getElementById('toggle-city-stats');
    const cityStatsPanel = document.getElementById('city-stats-panel');
    cityStatsToggle.addEventListener('click', () => {
      const expanded = cityStatsToggle.getAttribute('aria-expanded') === 'true';
      cityStatsToggle.setAttribute('aria-expanded', String(!expanded));
      cityStatsPanel.hidden = expanded;
      cityStatsToggle.querySelector('.collapse-label').textContent = expanded ? '展开' : '收起';
      cityStatsToggle.querySelector('.collapse-icon').textContent = expanded ? '▸' : '▾';
    });
    document.getElementById('load').addEventListener('click', loadActiveTab);

    for (const type of Object.keys(CONFIG)) {
      document.getElementById(type + '-prev').addEventListener('click', () => { pages[type]--; render(type); });
      document.getElementById(type + '-next').addEventListener('click', () => { pages[type]++; render(type); });
      document.getElementById(type + '-select-all').addEventListener('change', event => {
        selected[type].clear();
        if (event.target.checked) {
          rows[type].forEach(record => {
            const key = getRecordKey(record);
            if (key) selected[type].add(key);
          });
        }
        render(type);
      });
      document.getElementById(type + '-bulk-delete').addEventListener('click', () => deleteSelected(type));
    }

    tokenEl.addEventListener('keydown', event => {
      if (event.key === 'Enter') loadActiveTab();
    });

    // 默认打开欢迎页访问，即使刷新后也从这里开始。
    if (tokenEl.value) loadData('welcome');
    else {
      render('welcome');
      render('uninstall');
      render('feedback');
    }
  </script>
</body>
</html>
