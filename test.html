<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Feedback Admin</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }

    .bar {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    input {
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
      min-width: 280px;
    }

    button {
      padding: 8px 18px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font: inherit;
      cursor: pointer;
      transition: background-color .15s, opacity .15s;
    }

    button:hover:not(:disabled) {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: .5;
      cursor: default;
    }

    button.delete-btn {
      padding: 6px 12px;
      background: #dc2626;
      white-space: nowrap;
    }

    button.delete-btn:hover:not(:disabled) {
      background: #b91c1c;
    }

    #info {
      color: #64748b;
      font-size: 14px;
    }

    .wrap {
      overflow-x: auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .06);
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 14px;
    }

    th,
    td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: top;
    }

    th {
      background: #f1f5f9;
      white-space: nowrap;
    }

    td.c {
      min-width: 260px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    td.action {
      white-space: nowrap;
    }

    .tag {
      display: inline-block;
      margin: 0 4px 4px 0;
      padding: 2px 8px;
      border-radius: 999px;
      background: #e0e7ff;
      color: #3730a3;
      font-size: 12px;
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <div class="bar">
    <input id="token" type="password" placeholder="ADMIN_TOKEN" autocomplete="current-password">
    <button id="load">加载</button>
    <span id="info"></span>
  </div>

  <div class="wrap">
    <table>
      <thead>
        <tr>
          <th>时间</th>
          <th>原因</th>
          <th>留言</th>
          <th>语言</th>
          <th>国家</th>
          <th>城市</th>
          <th>版本</th>
          <th>使用天数</th>
          <th>使用分钟</th>
          <th>次数</th>
          <th>浏览器</th>
          <th>系统</th>
          <th>client_id</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="bar" style="margin-top:12px;justify-content:center">
    <button id="prev">上一页</button>
    <span id="pageinfo"></span>
    <button id="next">下一页</button>
  </div>

  <script>
    const API_BASE = 'https://mira-feedback.we35850.workers.dev';
    const API = `${API_BASE}/admin/list`;
    const DELETE_API = `${API_BASE}/admin/delete`;

    const LABELS = {
      site_broken: '网站失效',
      want_free: '想要免费',
      missing_feature: '缺少功能'
    };

    const PAGE_SIZE = 20;
    let allRows = [];
    let page = 0;

    const tokenEl = document.getElementById('token');
    const infoEl = document.getElementById('info');

    tokenEl.value = localStorage.getItem('adm') || '';

    function td(text, cls) {
      const el = document.createElement('td');
      if (cls) el.className = cls;
      el.textContent = text ?? '';
      return el;
    }

    const countryDisplay = new Intl.DisplayNames(['zh'], {
      type: 'region'
    });

    function countryName(code) {
      if (!code) return '';
      try {
        return countryDisplay.of(code);
      } catch {
        return code;
      }
    }

    function render() {
      const tbody = document.getElementById('rows');
      const pages = Math.max(1, Math.ceil(allRows.length / PAGE_SIZE));

      page = Math.min(Math.max(page, 0), pages - 1);
      tbody.innerHTML = '';

      allRows
        .slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE)
        .forEach(r => {
          const tr = document.createElement('tr');

          tr.appendChild(td(new Date(r.ts).toLocaleString()));

          const reasonCell = document.createElement('td');

          (r.reasons || []).forEach(k => {
            const s = document.createElement('span');
            s.className = 'tag';
            s.textContent = LABELS[k] || k;
            reasonCell.appendChild(s);
          });

          tr.appendChild(reasonCell);
          tr.appendChild(td(r.comment, 'c'));
          tr.appendChild(td(r.browser_lang));
          tr.appendChild(td(countryName(r.country)));
          tr.appendChild(td(r.city));
          tr.appendChild(td(r.version));
          tr.appendChild(td(r.days_used));
          tr.appendChild(td(r.minutes_used));
          tr.appendChild(td(r.usage_count));
          tr.appendChild(td(r.browser));
          tr.appendChild(td(r.os));
          tr.appendChild(td(r.client_id));

          const actionCell = document.createElement('td');
          actionCell.className = 'action';

          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'delete-btn';
          deleteBtn.textContent = '删除';
          deleteBtn.addEventListener('click', () => {
            deleteFeedback(r, deleteBtn);
          });

          actionCell.appendChild(deleteBtn);
          tr.appendChild(actionCell);

          tbody.appendChild(tr);
        });

      document.getElementById('pageinfo').textContent =
        `${page + 1} / ${pages}`;

      document.getElementById('prev').disabled = page === 0;
      document.getElementById('next').disabled = page >= pages - 1;
    }

    async function load() {
      infoEl.textContent = '加载中...';

      try {
        const res = await fetch(API, {
          headers: {
            Authorization: 'Bearer ' + tokenEl.value.trim()
          }
        });

        if (!res.ok) {
          infoEl.textContent =
            '失败：' + res.status +
            (res.status === 401 ? '（口令不对）' : '');
          return;
        }

        const data = await res.json();

        localStorage.setItem('adm', tokenEl.value.trim());

        allRows = Array.isArray(data.rows) ? data.rows : [];
        page = 0;
        render();

        infoEl.textContent = '共 ' + allRows.length + ' 条';
      } catch (e) {
        infoEl.textContent = '请求出错：' + e.message;
      }
    }

    async function deleteFeedback(record, button) {
      const preview = (record.comment || '').trim().slice(0, 120);

      const confirmed = confirm(
        '确定删除这条反馈吗？此操作不可撤销。\n\n' +
        '留言：' + (preview || '（无留言）') + '\n\n' +
        'client_id：' + record.client_id
      );

      if (!confirmed) return;

      button.disabled = true;
      infoEl.textContent = '正在删除...';

      try {
        const res = await fetch(DELETE_API, {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + tokenEl.value.trim(),
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            client_id: record.client_id
          })
        });

        const data = await res.json().catch(() => null);

        if (!res.ok || !data?.ok) {
          if (res.status === 401) {
            infoEl.textContent = '删除失败：管理口令无效';
          } else if (res.status === 404) {
            infoEl.textContent = '记录不存在，可能已被删除';
          } else {
            infoEl.textContent = '删除失败：' + res.status;
          }
          return;
        }

        allRows = allRows.filter(
          r => r.client_id !== record.client_id
        );

        render();
        infoEl.textContent = '已删除，共 ' + allRows.length + ' 条';
      } catch (e) {
        infoEl.textContent = '删除请求出错：' + e.message;
      } finally {
        if (button.isConnected) {
          button.disabled = false;
        }
      }
    }

    document.getElementById('load').addEventListener('click', load);

    document.getElementById('prev').addEventListener('click', () => {
      page--;
      render();
    });

    document.getElementById('next').addEventListener('click', () => {
      page++;
      render();
    });

    tokenEl.addEventListener('keydown', e => {
      if (e.key === 'Enter') load();
    });

    render();

    if (tokenEl.value) load();
  </script>
</body>

</html>
